{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Create an account</h2>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" value="{{ username }}" required autocomplete="username">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
  <label for="password">Password <small>(min 10 chars, upper, lower, digit)</small></label>
  <input type="password" id="password" name="password" required autocomplete="new-password">
  <label for="confirm">Confirm password</label>
  <input type="password" id="confirm" name="confirm" required autocomplete="new-password">
  <button class="btn" type="submit">Sign up</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
